<!doctype html>
<html lang="en">
<head>
<script>window.tally=window.tally||function(){window.tally.q.push(arguments)};window.tally.q=window.tally.q||[];</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style id="phone-rules">
/* PHONE RULES (mobile pass 2026-10-18). A game, not a document. First in the head so the game's own CSS wins.
   touch-action: manipulation = no double-tap zoom (every plain button had it); a board or canvas that handles
   its own gestures sets touch-action: none itself. 16px floor on inputs: iOS zooms the page into anything smaller
   and leaves it zoomed. No long-press selection or copy sheet on the game; inputs stay selectable. */
* { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
input, select, textarea { font-size: max(16px, 1em); }
</style>
<script>/* iOS ignores user-scalable=no; this is what stops a pinch from zooming the page */
addEventListener("gesturestart", (e) => e.preventDefault(), { passive: false });</script>
<title>%TITLE%</title>
<meta name="description" content="%DESC%">

<!-- The unfurl. Rendered server-side per URL: a scraper does not run scripts,
     so anything set from JavaScript is invisible to every chat client. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="%NAME%">
<meta property="og:title" content="%TITLE%">
<meta property="og:description" content="%DESC%">
<meta property="og:image" content="%CARD%">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="%TITLE%">
<meta property="og:url" content="%ORIGIN%">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="%TITLE%">
<meta name="twitter:description" content="%DESC%">
<meta name="twitter:image" content="%CARD%">
<meta name="theme-color" content="#f2e6cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0a09" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/icon.svg?v=%BUILD%">
<link rel="apple-touch-icon" href="/icon.png?v=%BUILD%">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/themes/%THEME%/theme.css?v=%BUILD%">
<link rel="stylesheet" href="/app.css?v=%BUILD%">
<script>window.RELAY = %CONFIG%; window.BUILD = "%BUILD%";</script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="how" class="chip" aria-label="How to play">?</button>
    <h1 id="wordmark">%NAME% <span id="num"></span></h1>
    <button id="crewbtn" class="chip" aria-label="Crew">🌍</button>
  </header>

  <!-- The stage is a fixed portrait box on every device. Same puzzle, same
       framing, phone or laptop — and on a laptop the space beside it becomes
       the rail rather than dead margin. -->
  <main id="stage" aria-live="polite"></main>

  <aside id="rail">
    <div class="rail-card" id="rail-board"></div>
    <div class="rail-card" id="rail-next"></div>
  </aside>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script defer src="https://gameaday.xyz/gameaday.js"></script>
<script type="module" src="/src/client/relay.mjs?v=%BUILD%"></script>
<script defer src="/t.js"></script>
<script defer src="https://hundred-carts-production.up.railway.app/credits.js" data-credits-game="pawsoff"></script>
<script defer src="https://bhc-arcade.fly.dev/t.js"></script>
</body>
</html>
