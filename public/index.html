<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>%TITLE%</title>
<meta name="description" content="%DESC%">

<!-- The unfurl. Rendered server-side per URL: a scraper does not run scripts,
     so anything set from JavaScript is invisible to every chat client. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="%NAME%">
<meta property="og:title" content="%TITLE%">
<meta property="og:description" content="%DESC%">
<meta property="og:image" content="%CARD%">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="%TITLE%">
<meta property="og:url" content="%ORIGIN%">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="%TITLE%">
<meta name="twitter:description" content="%DESC%">
<meta name="twitter:image" content="%CARD%">
<meta name="theme-color" content="#f2e6cf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0a09" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/icon.svg?v=%BUILD%">
<link rel="apple-touch-icon" href="/icon.png?v=%BUILD%">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/themes/%THEME%/theme.css?v=%BUILD%">
<link rel="stylesheet" href="/app.css?v=%BUILD%">
<script>window.RELAY = %CONFIG%; window.BUILD = "%BUILD%";</script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="how" class="chip" aria-label="How to play">?</button>
    <h1 id="wordmark">%NAME% <span id="num"></span></h1>
    <button id="crewbtn" class="chip" aria-label="Crew">🌍</button>
  </header>

  <!-- The stage is a fixed portrait box on every device. Same puzzle, same
       framing, phone or laptop — and on a laptop the space beside it becomes
       the rail rather than dead margin. -->
  <main id="stage" aria-live="polite"></main>

  <aside id="rail">
    <div class="rail-card" id="rail-board"></div>
    <div class="rail-card" id="rail-next"></div>
  </aside>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script type="module" src="/src/client/relay.mjs?v=%BUILD%"></script>
</body>
</html>
